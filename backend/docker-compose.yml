services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodsy
      POSTGRES_PASSWORD: foodsy
      POSTGRES_DB: foodsy
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodsy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOODSY_DB: postgres://foodsy:foodsy@db:5432/foodsy?sslmode=disable
      FOODSY_JWT_SECRET: ${FOODSY_JWT_SECRET:-change-me-in-prod}
      FOODSY_PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  pg
