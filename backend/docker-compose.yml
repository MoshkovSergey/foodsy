services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodgram
      POSTGRES_PASSWORD: foodgram
      POSTGRES_DB: foodgram
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodgram"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOODGRAM_DB: postgres://foodgram:foodgram@db:5432/foodgram?sslmode=disable
      FOODGRAM_JWT_SECRET: ${FOODGRAM_JWT_SECRET:-change-me-in-prod}
      FOODGRAM_PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
